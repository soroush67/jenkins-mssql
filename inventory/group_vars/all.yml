---
# Preserved exactly as the original hand-written docker-compose.yml had
# it - a moving tag (":2022-latest"), not pinned to an exact build.
# Recommended hardening (not applied without being asked): pin to a
# specific build tag once you've settled on one, so a container restart
# never silently pulls a newer SQL Server build. Not routed through
# docker-hosted.hamainsurance.net the way jenkins-postgresql's images
# are - the original file already pulled directly from Microsoft's own
# registry, preserved as-is rather than assuming an internal mirror
# exists for this one.
mssql_image: "mcr.microsoft.com/mssql/server:2022-latest"

# Where this REPO's own checkout lives - only ever used to locate
# templates/*.j2. Never used for deployed artifacts - see
# mssql_deploy_path below (same split as jenkins-postgresql, for the
# same reason: the deployed stack needs to be able to live at a stable
# path independent of wherever Jenkins checked out the repo).
mssql_project_root: "{{ playbook_dir }}/.."

# Where docker-compose.yml gets created on the target host - defaults to
# mssql_project_root (so local/manual testing needs no extra flag), but
# is the one thing meant to be overridden per real deployment (Jenkins:
# DEPLOY_PATH, passed as -e mssql_deploy_path=...).
mssql_deploy_path: "{{ mssql_project_root }}"

# The actual data VOLUME lives under /data/<last folder of
# mssql_deploy_path> instead - e.g. DEPLOY_PATH=/opt/servers/mssql-prod-1
# puts docker-compose.yml at /opt/servers/mssql-prod-1 but the real
# persistent volume at /data/mssql-prod-1. Same convention (and the same
# `realpath` requirement - see jenkins-postgresql's own README for the
# real bug that taught this) as this user's other Ansible+Jenkins
# projects. The original file used an external NAMED Docker volume
# ("ms-data") instead of a bind mount - changed to a bind mount here
# specifically so it can live under this same /data/<name> convention;
# flag if the named-volume approach was actually intentional.
mssql_volumes_root: "/data/{{ (mssql_deploy_path | realpath) | basename }}"
mssql_data_root: "{{ mssql_volumes_root }}/data"

# PRODUCTION: mount a real, dedicated disk at /data and set this true -
# see roles/preflight, which then refuses to deploy unless /data is a
# genuine separate mountpoint. Off by default (this sandbox has no
# second disk).
mssql_require_dedicated_mount: false
mssql_dedicated_mount_check_path: "/data"

mssql_container_name: "mssql"
mssql_hostname: "mssql"

# The value below is Ansible-Vault-encrypted (safe to commit as-is -
# the vault password itself is a separate secret, deliberately NOT
# documented here or in the README; see README's "Ansible Vault"
# section only for how to run playbooks against an encrypted value like
# this one). This is the LOCAL/MANUAL-RUN default only: Jenkins passes
# its own value via -e (a Jenkins credential binding, see Jenkinsfile),
# which always overrides this regardless of encryption. Deploy fails
# cleanly (roles/preflight asserts both that it's set AND that it meets
# SQL Server's own password policy - at least 8 characters from 3 of
# {uppercase, lowercase, digit, symbol} - so a bad password fails here
# with a clear message instead of a confusing container crash-loop).
mssql_sa_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          31353736386532393566616666666237616333366138623763353162326135656134386137643230
          6232393562306563323265323730636435326532613437610a613834373863323565346132663939
          61623237353735613036333533306135363064396564646531383534323234333164386633653761
          3238353962353534350a636464626638636630316434363931363466646461666334363333373566
          33653338393865303365333131383832613237663866623936363831643532616434

# Express / Standard / Enterprise / Developer - preserved as a variable
# instead of hardcoded, same as everything else here. "Express" matches
# what the original file already had.
mssql_pid: "Express"

mssql_port: 1433

# external: true in the original compose file - must already exist on
# the target host. roles/preflight creates it if missing (idempotent),
# same pattern as jenkins-postgresql's own external network handling.
mssql_networks:
  - db-net

# The mssql image's own built-in non-root user - confirmed directly
# (`id` inside mcr.microsoft.com/mssql/server:2022-latest -> uid/gid
# 10001, "mssql"). Unlike jenkins-postgresql's postgres image, this
# image already bakes in `USER mssql` by default (root only has to be
# explicitly requested via --user root for the one-off chown step, not
# assumed as the default when --user is simply omitted - confirmed
# directly, this tripped up the first chown attempt here).
mssql_run_uid: 10001
mssql_run_gid: 10001

# Preserved from the original file.
mssql_mem_limit: "6144m"
mssql_mem_reservation: "128m"
mssql_cpus: "2.0"
mssql_cpu_shares: 512

# mssql_exporter - awaragi/prometheus-mssql-exporter, the actively
# maintained community exporter for this (Microsoft doesn't publish an
# official one). Pinned by exact tag (confirmed directly this resolves
# to the same image digest as :latest at the time this was added, not
# assumed) rather than following this project's own existing
# mssql_image convention of a moving tag.
mssql_exporter_image: "awaragi/prometheus-mssql-exporter:v1.3.0"
mssql_exporter_container_name: "mssql-exporter"

# A dedicated login, never sa - confirmed directly this exporter's own
# queries (sys.dm_os_performance_counters, sys.dm_io_virtual_file_stats,
# sys.dm_os_process_memory, etc.) only need VIEW SERVER STATE, which
# roles/mssql grants explicitly (see templates/exporter-login.sql.j2) -
# matching postgres_exporter's/mongo_exporter's own separate-role
# pattern in pg-stack/mongo-stack. Kept in sync via ALTER LOGIN on every
# deploy using the CURRENT mssql_sa_password to authenticate - reliable
# as long as mssql_sa_password itself hasn't drifted from what's
# actually active on the running instance (see README's "Known
# limitation" for the one case where that assumption doesn't hold).
mssql_exporter_user: "mssql_exporter"
mssql_exporter_password: ""

mssql_exporter_port: 4000

# The image bakes in no dedicated non-root user at all (runs as root by
# default, confirmed directly via `docker exec ... id`) - unlike
# mssql_run_uid/postgres/mongo's own images, this uid is not "the
# image's own identity", just an arbitrary safe non-root uid confirmed
# directly to work fine under cap_drop: ALL.
mssql_exporter_run_uid: 1000
mssql_exporter_run_gid: 1000

mssql_exporter_mem_limit: "128m"
mssql_exporter_cpus: "0.25"
